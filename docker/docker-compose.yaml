services:
  minio:
    image: quay.io/minio/minio
    container_name: minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./minio_storage:/data
    command: server /data --console-address ":9001"
    restart: always